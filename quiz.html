<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>퀴즈 — rl notebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..700,0..100,0..1&family=Gaegu:wght@400;700&family=Geist:wght@400;500&family=Gowun+Dodum&family=JetBrains+Mono&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<link rel="stylesheet" href="assets/style.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script defer src="assets/app.js"></script>
<script defer src="assets/quiz-figs.js"></script>
<script defer src="assets/quiz-data.js"></script>
<style>
  .qz { max-width: 860px; margin: 0 auto; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 4px; }
  .chip-btn { font-family: var(--font-ui); font-size: 14px; border: 1.5px solid var(--mist); background: var(--cream); border-radius: 20px; padding: 6px 14px; cursor: pointer; color: var(--charcoal); }
  .chip-btn:hover { border-color: var(--charcoal); }
  .chip-btn.on { border-color: var(--charcoal); background: #fff; box-shadow: var(--shadow-btn); }
  .chip-btn .n { color: var(--muted); font-size: 12px; margin-left: 4px; }
  .setup-row { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: center; margin: 14px 0; font-family: var(--font-ui); font-size: 14px; }
  .setup-row label { display: inline-flex; gap: 6px; align-items: center; }
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 10px; }
  .stat { border: 1px solid rgba(23,23,23,.15); border-radius: 10px; padding: 10px 12px; background: #fff; font-family: var(--font-ui); font-size: 13px; }
  .stat b { display: block; font-family: var(--font-display); font-size: 22px; color: var(--cocoa); }
  .qhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-family: var(--font-ui); font-size: 14px; color: var(--muted); }
  .qbar { height: 6px; border-radius: 6px; background: var(--dew); overflow: hidden; margin: 8px 0 18px; border: 1px solid rgba(23,23,23,.1); }
  .qbar i { display: block; height: 100%; background: var(--orange); transition: width .3s; }
  .qtag { font-family: var(--font-ui); font-size: 12px; border: 1px solid var(--charcoal); border-radius: 20px; padding: 1px 10px; }
  .qtext { font-size: 21px; line-height: 1.6; margin: 6px 0 18px; }
  .opts { display: grid; gap: 10px; }
  .opt { text-align: left; font: inherit; font-size: 17px; border: 1.5px solid var(--charcoal); background: #fff; border-radius: 12px; padding: 12px 16px; cursor: pointer; display: flex; gap: 12px; align-items: baseline; color: var(--cocoa); }
  .opt:hover:not(:disabled) { background: var(--dew); }
  .opt .k { font-family: var(--font-ui); font-size: 13px; color: var(--muted); min-width: 18px; }
  .opt.sel { border-color: var(--orange); background: #fff3ea; }
  .opt.right { border-color: var(--sprout); background: #e8f7ee; }
  .opt.wrong { border-color: #dc2626; background: #fdecec; }
  .opt:disabled { cursor: default; }
  .qfig { margin: 4px 0 16px; padding: 12px; background: #fff; border: 1px solid rgba(23,23,23,.12); border-radius: 12px; display: flex; justify-content: center; overflow-x: auto; }
  .qfig.small { margin: 8px 0; padding: 8px; transform-origin: left top; }
  .qfig.small svg { max-width: 300px !important; }
  .qfig .tbl-wrap { margin: 0; }
  .qfig pre.code { margin: 0; width: 100%; }
  .multi-tag { font-family: var(--font-ui); font-size: 12px; border: 1px solid var(--sienna); color: var(--sienna); border-radius: 20px; padding: 1px 9px; vertical-align: middle; }
  .opt.chk .k { width: 18px; height: 18px; border: 1.5px solid var(--charcoal); border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; flex: none; }
  .opt.chk.sel .k { background: var(--orange); border-color: var(--orange); color: #fff; }
  .opt.missed { border-color: var(--sprout); border-style: dashed; background: #f3fbf5; }
  .opt.missed::after { content: "← 이것도 정답"; font-family: var(--font-ui); font-size: 12px; color: #15803d; margin-left: auto; }
  .oxrow { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .oxrow .opt { justify-content: center; font-family: var(--font-display); font-size: 40px; padding: 18px; }
  .numrow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .numrow input { font-family: var(--font-mono); font-size: 20px; padding: 10px 14px; border: 1.5px solid var(--charcoal); border-radius: 10px; width: 220px; background: #fff; }
  .numrow input.right { border-color: var(--sprout); background: #e8f7ee; }
  .numrow input.wrong { border-color: #dc2626; background: #fdecec; }
  .fb { margin-top: 18px; border-radius: 12px; padding: 14px 18px; display: none; }
  .fb.show { display: block; }
  .fb.ok { background: #e8f7ee; border: 1px solid #86d6a3; }
  .fb.no { background: #fdecec; border: 1px solid #f2a6a6; }
  .fb .t { font-family: var(--font-hand); font-size: 26px; line-height: 1.1; }
  .fb.ok .t { color: #15803d; } .fb.no .t { color: #b91c1c; }
  .fb a { font-family: var(--font-ui); font-size: 13px; }
  .qnav { display: flex; justify-content: space-between; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
  .big-score { font-family: var(--font-display); font-weight: 600; font-size: 88px; line-height: 1; color: var(--cocoa); }
  .big-score small { font-size: 32px; color: var(--muted); }
  .rv { border-top: 1px dashed rgba(23,23,23,.15); padding: 12px 0; }
  .rv .q { font-size: 16px; }
  .rv .a { font-size: 15px; color: #15803d; margin-top: 4px; }
  .rv .yours { font-size: 14px; color: #b91c1c; }
  .rv .e { font-size: 14px; color: var(--muted); margin-top: 4px; }
  .hint-keys { font-family: var(--font-ui); font-size: 12px; color: var(--muted); }
  @media (max-width: 640px) { .qtext { font-size: 18px; } .big-score { font-size: 64px; } }
</style>
</head>
<body data-page="quiz">

<div class="wrap">
  <div class="hero">
    <span class="kicker">풀면서 외우기 · 단원별 / 전체</span>
    <h1 class="display">quiz<br>time</h1>
    <p class="lede">객관식 · OX · 계산 문제를 섞어서 바로 채점하고 해설을 보여 줘요. 틀린 문제는 <span class="mk">오답노트</span>에 자동으로 모이고, 다시 맞히면 빠져요.</p>
    <div data-sticker="bear" data-rot="8" style="right:8%;top:70px;width:80px;height:76px"></div>
    <div data-sticker="bolt" data-rot="-12" style="right:19%;top:200px;width:48px;height:64px"></div>
  </div>

  <div class="qz">
    <!-- 설정 -->
    <section class="card" id="setup">
      <h2>문제 고르기</h2>
      <div class="chips" id="chChips"></div>
      <div class="setup-row">
        <label>문제 수 <select id="cnt"><option value="10" selected>10문제</option><option value="20">20문제</option><option value="0">전부</option></select></label>
        <label><input type="checkbox" class="ty" value="mc" checked> 객관식·복수선택</label>
        <label><input type="checkbox" class="ty" value="ox" checked> OX</label>
        <label><input type="checkbox" class="ty" value="num" checked> 계산</label>
        <label><input type="checkbox" id="shuffle" checked> 순서 섞기</label>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="pill" type="button" id="startBtn">시작하기 →</button>
        <button class="pill" type="button" id="wrongBtn">오답만 다시 풀기</button>
      </div>
      <div class="stats" id="stats"></div>
    </section>

    <!-- 문제 -->
    <section class="card" id="play" hidden>
      <div class="qhead"><span id="qpos"></span><span class="qtag" id="qtag"></span></div>
      <div class="qbar"><i id="qbar"></i></div>
      <div class="qtext" id="qtext"></div>
      <div id="qinput"></div>
      <div class="fb" id="fb"></div>
      <div class="qnav">
        <button class="pill small" type="button" id="quitBtn">그만하기</button>
        <span class="hint-keys">키보드: 1~4 / O·X 선택 · Enter 확인·다음</span>
        <button class="pill" type="button" id="nextBtn">확인</button>
      </div>
    </section>

    <!-- 결과 -->
    <section class="card" id="result" hidden>
      <span class="kicker" id="resMsg"></span>
      <div class="big-score" id="score"></div>
      <div class="stats" id="resBreak"></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin:18px 0">
        <button class="pill" type="button" id="retryWrong">틀린 것만 다시</button>
        <button class="pill" type="button" id="again">새로 풀기</button>
        <span id="chLinks" style="display:contents"></span>
      </div>
      <h3>문제별 결과</h3>
      <div id="review"></div>
    </section>

    <!-- 오답노트 -->
    <section class="card tint" id="wrongNote">
      <h2>오답노트 <span class="ko" id="wnCount"></span></h2>
      <p style="font-size:15px;color:var(--muted)">틀린 문제가 여기 모여요. “오답만 다시 풀기”에서 맞히면 자동으로 빠져요.</p>
      <div id="wnList"></div>
      <div style="margin-top:12px"><button class="pill small" type="button" id="wnClear">오답노트 비우기</button></div>
    </section>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const Q = window.RL_QUIZ, S = window.RL_STORE;
  const $ = id => document.getElementById(id);
  const render = el => window.RL_RENDER_MATH && window.RL_RENDER_MATH(el);
  const CH = [['all', '전체'], ['02', '02 MDP'], ['03', '03 Bellman'], ['04', '04 DP'], ['05', '05 MC'], ['06', '06 TD']];
  const typeName = { mc: '객관식', multi: '복수 선택', ox: 'OX', num: '계산' };
  const tyOf = q => q.type === 'multi' ? 'mc' : q.type;
  let chSel = S.get('quiz-ch') || 'all';
  let wrong = new Set(S.get('quiz-wrong') || []);
  let stats = S.get('quiz-stats') || {};
  let set = [], idx = 0, answers = [], picked = null, checked = false;

  /* ---------- 설정 화면 ---------- */
  function drawChips() {
    $('chChips').innerHTML = CH.map(([k, nm]) => {
      const n = k === 'all' ? Q.length : Q.filter(q => q.ch === k).length;
      return `<button type="button" class="chip-btn ${k === chSel ? 'on' : ''}" data-k="${k}">${nm}<span class="n">${n}</span></button>`;
    }).join('');
  }
  $('chChips').onclick = e => { const b = e.target.closest('[data-k]'); if (!b) return; chSel = b.dataset.k; S.set('quiz-ch', chSel); drawChips(); };
  function drawStats() {
    $('stats').innerHTML = CH.map(([k, nm]) => {
      const s = stats[k];
      return `<div class="stat">${nm}<b>${s ? s.best + '%' : '–'}</b>${s ? `최고 · 최근 ${s.last}% · ${s.n}회` : '아직 안 풀었어요'}</div>`;
    }).join('');
    $('wrongBtn').textContent = `오답만 다시 풀기 (${wrong.size})`;
    $('wrongBtn').disabled = !wrong.size;
  }
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }

  function start(list, label) {
    if (!list.length) { alert('조건에 맞는 문제가 없어요. 유형 체크를 확인해 주세요.'); return; }
    set = list; idx = 0; answers = [];
    set.label = label;
    $('setup').hidden = true; $('result').hidden = true; $('play').hidden = false;
    show();
    $('play').scrollIntoView({ block: 'start' });
  }
  $('startBtn').onclick = () => {
    const types = [...document.querySelectorAll('.ty:checked')].map(x => x.value);
    let list = Q.filter(q => (chSel === 'all' || q.ch === chSel) && types.includes(tyOf(q)));
    if ($('shuffle').checked) shuffle(list);
    const n = +$('cnt').value; if (n) list = list.slice(0, n);
    start(list, chSel);
  };
  $('wrongBtn').onclick = () => start(shuffle(Q.filter(q => wrong.has(q.id))), 'wrong');

  /* ---------- 문제 화면 ---------- */
  function show() {
    const q = set[idx]; picked = null; checked = false;
    $('qpos').textContent = `${idx + 1} / ${set.length}`;
    $('qbar').style.width = (idx / set.length * 100) + '%';
    $('qtag').textContent = `${q.ch}장 · ${typeName[q.type]}`;
    $('qtext').innerHTML = (q.fig ? `<div class="qfig">${q.fig}</div>` : '') + q.q + (q.type === 'multi' ? ' <span class="multi-tag">복수 선택</span>' : '');
    const box = $('qinput');
    if (q.type === 'mc' || q.type === 'multi') box.innerHTML = `<div class="opts">${q.c.map((c, i) => `<button type="button" class="opt${q.type === 'multi' ? ' chk' : ''}" data-i="${i}"><span class="k">${i + 1}</span><span>${c}</span></button>`).join('')}</div>`;
    else if (q.type === 'ox') box.innerHTML = `<div class="oxrow"><button type="button" class="opt" data-i="1">O</button><button type="button" class="opt" data-i="0">X</button></div>`;
    else box.innerHTML = `<div class="numrow"><input type="text" inputmode="decimal" id="numIn" placeholder="숫자 입력 (예: -2.25)" autocomplete="off"><span class="hint-keys">소수·음수 OK, 1/4 같은 분수도 OK</span></div>`;
    if (q.type === 'multi') picked = new Set();
    box.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      if (checked) return;
      const i = +b.dataset.i;
      if (q.type === 'multi') { picked.has(i) ? picked.delete(i) : picked.add(i); b.classList.toggle('sel', picked.has(i)); return; }
      picked = i; box.querySelectorAll('.opt').forEach(x => x.classList.toggle('sel', x === b));
    });
    const fb = $('fb'); fb.className = 'fb'; fb.innerHTML = '';
    $('nextBtn').textContent = '확인';
    render($('qtext')); render(box);
    if (q.type === 'num') setTimeout(() => $('numIn').focus(), 50);
  }
  function parseNum(s) {
    s = String(s).trim().replace(/−/g, '-').replace(/,/g, '');
    const m = s.match(/^(-?\d+(?:\.\d+)?)\s*\/\s*(-?\d+(?:\.\d+)?)$/);
    if (m) return +m[1] / +m[2];
    return s === '' ? NaN : Number(s);
  }
  function fmtAns(q) {
    if (q.type === 'mc') return `${q.a + 1}번 · ${q.c[q.a]}`;
    if (q.type === 'multi') return q.a.map(i => `${i + 1}번`).join(', ');
    if (q.type === 'ox') return q.a ? 'O' : 'X';
    return String(q.a);
  }
  function check() {
    const q = set[idx];
    let ok, given;
    if (q.type === 'num') {
      const v = parseNum($('numIn').value);
      if (isNaN(v)) { $('numIn').focus(); return; }
      given = $('numIn').value; ok = Math.abs(v - q.a) <= (q.tol ?? 0.01);
      $('numIn').classList.add(ok ? 'right' : 'wrong'); $('numIn').disabled = true;
    } else if (q.type === 'multi') {
      if (!picked.size) return;
      const want = new Set(q.a);
      ok = picked.size === want.size && [...picked].every(i => want.has(i));
      given = [...picked].sort().map(i => `${i + 1}번`).join(', ');
      $('qinput').querySelectorAll('.opt').forEach(b => {
        b.disabled = true;
        const i = +b.dataset.i;
        if (want.has(i)) b.classList.add(picked.has(i) ? 'right' : 'missed'); else if (picked.has(i)) b.classList.add('wrong');
      });
    } else {
      if (picked === null) return;
      const correct = q.type === 'mc' ? q.a : (q.a ? 1 : 0);
      ok = picked === correct;
      given = q.type === 'mc' ? `${picked + 1}번 · ${q.c[picked]}` : (picked ? 'O' : 'X');
      $('qinput').querySelectorAll('.opt').forEach(b => {
        b.disabled = true;
        const i = +b.dataset.i;
        if (i === correct) b.classList.add('right'); else if (i === picked) b.classList.add('wrong');
      });
    }
    checked = true;
    answers.push({ q, ok, given });
    if (ok) wrong.delete(q.id); else wrong.add(q.id);
    S.set('quiz-wrong', [...wrong]);
    const fb = $('fb');
    fb.className = 'fb show ' + (ok ? 'ok' : 'no');
    fb.innerHTML = `<div class="t">${ok ? '정답! 🎉' : '아쉬워요 🥲'}</div>${ok ? '' : `<div style="margin:4px 0">정답: <b>${fmtAns(q)}</b></div>`}<div>${q.ex}</div><div style="margin-top:6px"><a href="${q.sec}" target="_blank">관련 섹션 보기 →</a></div>`;
    render(fb);
    $('nextBtn').textContent = idx + 1 < set.length ? '다음 문제 →' : '결과 보기';
    $('qbar').style.width = ((idx + 1) / set.length * 100) + '%';
  }
  function next() { if (!checked) return check(); idx++; if (idx < set.length) show(); else finish(); }
  $('nextBtn').onclick = next;
  $('quitBtn').onclick = () => { if (answers.length) finish(); else { $('play').hidden = true; $('setup').hidden = false; } };
  document.addEventListener('keydown', e => {
    if ($('play').hidden) return;
    const q = set[idx]; if (!q) return;
    if (e.key === 'Enter') { e.preventDefault(); next(); return; }
    if (checked || q.type === 'num') return;
    let i = null;
    if ((q.type === 'mc' || q.type === 'multi') && /^[1-9]$/.test(e.key) && +e.key <= q.c.length) i = +e.key - 1;
    if (q.type === 'ox') { if (/^[oO1ㅐ]$/.test(e.key)) i = 1; if (/^[xX2ㅌ]$/.test(e.key)) i = 0; }
    if (i !== null) $('qinput').querySelector(`.opt[data-i="${i}"]`)?.click();
  });

  /* ---------- 결과 ---------- */
  function finish() {
    $('play').hidden = true; $('result').hidden = false;
    const n = answers.length, c = answers.filter(a => a.ok).length, pct = n ? Math.round(c / n * 100) : 0;
    $('score').innerHTML = `${c}<small> / ${n}</small>`;
    $('resMsg').textContent = pct === 100 ? '완벽해요!! 🏆' : pct >= 80 ? '거의 다 왔어요 💪' : pct >= 50 ? '좋아요, 오답만 다시 보면 돼요' : '괜찮아요, 해설 보고 다시 해봐요';
    if (set.label !== 'wrong') {
      const st = stats[set.label] || { best: 0, last: 0, n: 0 };
      st.last = pct; st.best = Math.max(st.best, pct); st.n++;
      stats[set.label] = st; S.set('quiz-stats', stats);
    }
    const byCh = {};
    answers.forEach(a => { const k = a.q.ch; byCh[k] = byCh[k] || [0, 0]; byCh[k][1]++; if (a.ok) byCh[k][0]++; });
    $('resBreak').innerHTML = Object.keys(byCh).sort().map(k => `<div class="stat">${k}장<b>${byCh[k][0]} / ${byCh[k][1]}</b>${Math.round(byCh[k][0] / byCh[k][1] * 100)}%</div>`).join('');
    $('review').innerHTML = answers.map((a, i) => `<div class="rv"><div class="q">${a.ok ? "✅" : "❌"} <b>${i + 1}.</b> ${a.q.q}</div>${a.q.fig ? `<div class="qfig small">${a.q.fig}</div>` : ""}
      ${a.ok ? '' : `<div class="yours">내 답: ${a.given}</div>`}<div class="a">정답: ${fmtAns(a.q)}</div><div class="e">${a.q.ex} · <a href="${a.q.sec}" target="_blank">섹션 보기</a></div></div>`).join('');
    $('retryWrong').disabled = !answers.some(a => !a.ok);
    const chs = window.RL_CHAPTERS || [], ci = chs.findIndex(c => c.id === set.label);
    $('chLinks').innerHTML = ci < 0 ? '' :
      `<a class="pill" href="${chs[ci].file}">← ${chs[ci].id}장으로 돌아가기</a>` +
      (chs[ci + 1] ? `<a class="pill" href="${chs[ci + 1].file}">다음 단원: ${chs[ci + 1].id}. ${chs[ci + 1].title} →</a>` : '');
    render($('review'));
    drawStats(); drawWrong();
    $('result').scrollIntoView({ block: 'start' });
  }
  $('retryWrong').onclick = () => start(shuffle(answers.filter(a => !a.ok).map(a => a.q)), 'wrong');
  $('again').onclick = () => { $('result').hidden = true; $('setup').hidden = false; $('setup').scrollIntoView({ block: 'start' }); };

  /* ---------- 오답노트 ---------- */
  function drawWrong() {
    const list = Q.filter(q => wrong.has(q.id));
    $('wnCount').textContent = list.length ? `${list.length}문제` : '';
    $('wnList').innerHTML = list.length ? list.map(q => `<div class="rv"><div class="q"><span class="qtag">${q.ch}장</span> ${q.q}</div>${q.fig ? `<div class="qfig small">${q.fig}</div>` : ""}<div class="a">정답: ${fmtAns(q)}</div><div class="e">${q.ex} · <a href="${q.sec}" target="_blank">섹션 보기</a></div></div>`).join('')
      : '<p style="color:var(--muted)">아직 틀린 문제가 없어요 👍</p>';
    $('wnClear').hidden = !list.length;
    render($('wnList'));
  }
  $('wnClear').onclick = () => { if (confirm('오답노트를 비울까요?')) { wrong.clear(); S.set('quiz-wrong', []); drawWrong(); drawStats(); } };

  drawChips(); drawStats(); drawWrong();

  // 단원 페이지에서 넘어온 경우: quiz.html?ch=04 → 그 단원 전체 문제를 섞어서 바로 시작
  const want = new URLSearchParams(location.search).get('ch');
  if (want && CH.some(([k]) => k === want)) {
    chSel = want; S.set('quiz-ch', chSel); drawChips();
    const list = shuffle(Q.filter(q => want === 'all' || q.ch === want));
    start(list, want);
  }
});
</script>
</body>
</html>
